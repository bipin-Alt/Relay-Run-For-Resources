name: Relay CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  api: 
    runs-on: ubuntu-latest
    strategy:
      matrix : 
        node-version: [22.x]

    steps : 
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/actions-setup@v4
        with: 
          version: 11.9.0
       
      - name: Setup Node.js
        uses: actions/setup-node@v4
        
        with: 
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile    
      - name: API Typecheck
        run: pnpm --filter @relay/api typecheck
      - name: API build
        run: pnpm --filter @relay/api build

  web :

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]
        

    steps:
      - name: Checkout repository 
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
         version: 11.9.0 
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Web Typecheck
        run: pnpm --filter web typecheck
      - name: Web lint
        run: pnpm --filter web lint
      - name: Web build
        run: pnpm --filter web build

  Integration: 
    runs-on: ubuntu-latest
    needs: [api,web]

  ### Steps the integration we'll do this later

